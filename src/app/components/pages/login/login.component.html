<div class="auth-layout">
  <div class="auth-container">
    <div class="text-center mb-4">
      <h1 class="text-2xl font-bold">Welcome back</h1>
      <p class="text-sm text-muted mt-1">
        Log in to your account to continue
      </p>
    </div>

    <!-- Social Login Buttons -->
    <div class="social-buttons">
      <button class="social-btn" (click)="handleGoogleLogin()">
        <i class="material-icons">person</i>
        <span>Continue with Google</span>
      </button>
      <button class="social-btn" (click)="handleFacebookLogin()">
        <i class="material-icons">facebook</i>
        <span>Continue with Facebook</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="auth-divider">
      <span class="divider-text">or continue with</span>
    </div>

    <!-- Login Tabs -->
    <div class="login-tabs">
      <div class="tabs-header">
        <button [class.active]="activeTab === 'email'" (click)="activeTab = 'email'" class="tab-btn">
          <i class="material-icons">mail</i>
          <span>Email</span>
        </button>
        <button [class.active]="activeTab === 'phone'" (click)="activeTab = 'phone'" class="tab-btn">
          <i class="material-icons">phone</i>
          <span>Phone</span>
        </button>
      </div>

      <!-- Email Login Form -->
      <div class="tab-content" *ngIf="activeTab === 'email'">
        <form (ngSubmit)="handleEmailLogin()" class="login-form">
          <div class="form-group">
            <input 
              type="email" 
              class="auth-input" 
              placeholder="Email address"
              [(ngModel)]="email"
              name="email"
            >
            <input 
              type="password" 
              class="auth-input" 
              placeholder="Password"
              [(ngModel)]="password"
              name="password"
            >
          </div>
          <div class="text-right">
            <a href="/forgot-password" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="auth-button">Log in</button>
        </form>
      </div>

      <!-- Phone Login Form -->
      <div class="tab-content" *ngIf="activeTab === 'phone'">
        <ng-container *ngIf="!isOtpSent">
          <form (ngSubmit)="handleSendOtp()" class="login-form">
            <input 
              type="tel" 
              class="auth-input" 
              placeholder="Phone number"
              [(ngModel)]="phoneNumber"
              name="phoneNumber"
            >
            <button type="submit" class="auth-button">Send verification code</button>
          </form>
        </ng-container>

        <ng-container *ngIf="isOtpSent">
          <div class="otp-section">
            <p class="text-center text-sm text-muted">
              Enter the 6-digit code sent to {{phoneNumber}}
            </p>
            <div class="otp-input">
              <input 
                type="text" 
                class="otp-digit" 
                maxlength="1"
                *ngFor="let _ of [1,2,3,4,5,6]"
                (keyup)="onOtpDigitInput($event)"
              >
            </div>
            <div class="otp-actions">
              <button (click)="isOtpSent = false" class="text-link">
                Use a different number
              </button>
              <button class="text-link">
                Resend code
              </button>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

    <!-- Sign Up Link -->
    <div class="text-center mt-4">
      <p class="text-sm text-muted">
        Don't have an account?
        <a routerLink="/signup" class="text-primary font-medium hover-underline">
          Sign up
        </a>
      </p>
    </div>
  </div>
</div>
