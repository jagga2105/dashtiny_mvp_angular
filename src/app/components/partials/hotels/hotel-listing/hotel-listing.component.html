 <div class="container my-4" *ngIf="submittedDataServiceService.showListing">
 <div class="row">

        <div class="col-9 flight-list">
            <div class="d-flex my-4">
                <ul class="nav nav-tabs col-12 p-0" role="tablist">
                  <li class="nav-item col-4 p-0">
                    <a class="nav-link active" id="lowCost-tab" data-toggle="tab" href="#lowCost" role="tab" aria-controls="lowCost" aria-selected="true"><b>Low Cost</b></a>
                  </li>
                  <li class="nav-item col-4 p-0">
                    <a class="nav-link" id="direct-tab" data-toggle="tab" href="#direct" role="tab" aria-controls="direct" aria-selected="false"><b>Direct</b></a>
                  </li>
                  <li class="nav-item col-4 p-0">
                    <a class="nav-link" id="timing-tab" data-toggle="tab" href="#timing" role="tab" aria-controls="timing" aria-selected="false"><b>Timing</b></a>
                  </li>
                </ul>
              </div>
              <div class="tab-content">
                <div class="tab-pane fade show active" id="lowCost" role="tabpanel" aria-labelledby="lowCost-tab">
                  <!-- Content for the "Low Cost" tab goes here -->
                <app-hotel-cards></app-hotel-cards>
                <!-- <app-movies></app-movies> -->
                </div>
                <div class="tab-pane fade" id="direct" role="tabpanel" aria-labelledby="direct-tab">
                  <!-- Content for the "Direct" tab goes here -->
                  here comes some more card
                </div>
                <div class="tab-pane fade" id="timing" role="tabpanel" aria-labelledby="timing-tab">
                  <!-- Content for the "Timing" tab goes here -->
                  here comes some more more card
                </div>
              </div>

            <div class="d-flex">
                <div class="col-6"></div>
                <div class="col-6"></div>
            </div>
        </div>
        <div class="col-3 filter-section">
          <div class="my-4">
            <div class="map-wrap">
              <div class="map" #map></div>
            </div>
          </div>
      </div>

    </div>
</div>
